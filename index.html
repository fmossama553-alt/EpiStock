<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2a5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>LEONI Epissure Manager</title>
<style>
:root{--navy:#0a1a3a;--blue:#0a66d6;--bg:#eef3fb;--tx:#0f1b33;--mut:#6b7893;--red:#d12c2c;--ok:#0f9d6b;--ln:#e3e9f4}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:78px}
header{background:linear-gradient(#0a1a3a,#0b2a5b);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header small{letter-spacing:.12em;font-size:11px;opacity:.75;display:block}
header h1{margin:2px 0 0;font-size:22px}
header select{background:#16346b;color:#fff;border:0;border-radius:10px;padding:9px 10px;font-weight:700;width:auto}
main{padding:14px;max-width:640px;margin:auto}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0a1a3a14;border-inline-start:4px solid transparent}
.card.urg{border-inline-start-color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px;margin:4px 0}.sm{font-size:12px;font-weight:700;margin-top:8px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:18px}.red{color:var(--red)}.okc{color:var(--ok)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi b{font-size:34px;display:block}.kpi span{color:var(--mut);font-size:14px}
.badge{border-radius:99px;padding:5px 11px;font-size:13px;background:#eef3fb;white-space:nowrap}
.badge i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.nums div{background:#e8eef9;border-radius:12px;padding:10px 4px;text-align:center}
.nums b{font-size:22px;display:block;font-family:ui-monospace,monospace}.nums span{font-size:11px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-family:ui-monospace,monospace;font-size:12px;padding:5px 9px;border-radius:9px;cursor:pointer}
.chip.ok{background:#dff5ec;color:#0a7a52}.chip.store{background:#fdf0d8;color:#b36d00}
input,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;font-size:16px;background:#fff;color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;width:100%;cursor:pointer;text-align:center;display:block}
.btn.sq{width:48px;flex:none;padding:12px}.btn.del{background:#fde8e8;color:var(--red)}.btn.alt{background:#e8eef9;color:var(--blue)}
.act{margin-top:10px}.act select{flex:1}
.crow{display:flex;gap:6px;margin-top:6px}.crow select{width:42%}.crow button{border:0;background:#fde8e8;color:var(--red);border-radius:10px;width:44px;flex:none}
.bar{height:9px;background:#e3e9f4;border-radius:9px;margin:5px 0 12px;overflow:hidden}.bar div{height:100%;border-radius:9px}
.miss{margin-top:8px}.miss b{color:var(--red);font-size:20px}
.found{background:#e8f1ff;border:1px solid #bcd4fb;cursor:pointer}
table{width:100%;border-collapse:collapse}th{background:var(--navy);color:#fff;padding:10px;font-size:13px;text-align:start}td{padding:10px;border-bottom:1px solid var(--ln)}tr[onclick]{cursor:pointer}
.top{position:sticky;top:64px;z-index:4;background:var(--bg);padding:2px 0 8px}
.back{background:none;border:0;color:var(--blue);font-size:16px;font-weight:700;padding:4px 0 10px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;max-width:640px;margin:auto;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.sheet h3{margin:0 0 4px}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;display:flex;border-top:1px solid var(--ln);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 2px 11px;font-size:11px;color:var(--mut)}
nav button span{display:block;font-size:20px}nav button.on{color:var(--blue);font-weight:700}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#0a1a3a;color:#fff;padding:11px 18px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
footer{text-align:center;color:var(--mut);font-size:12px;margin:18px 0}
[dir=rtl] .nxt{transform:scaleX(-1)}
</style>
</head>
<body>
<header><div><small>LEONI · EPISSURE</small><h1 id="ttl"></h1></div>
<select id="lg" onchange="setLang(this.value)"><option value="fr">FR</option><option value="ar">AR</option><option value="en">EN</option></select></header>
<main id="app"></main>
<footer id="ft"></footer>
<nav id="nav"></nav>
<div id="modal" onclick="if(event.target==this)closeForm()"></div>
<div id="toast"></div>
<script>
const T={
fr:{dash:'Tableau',lack:'Manques',lines:'Lignes',hist:'Historique',nLines:'Lignes de production',nTotal:'Manques ouverts',nUrg:'Manques urgents',nDone:'Demandes livrées',by:'Par statut',recent:'Manques urgents récents',add:'+ Nouveau manque',addEp:'+ Épissure',line:'Ligne',ref:'Nom / référence épissure',req:'Qté demandée',avail:'Qté disponible',miss:'Qté manquante',loc:'Emplacement',prep:'Préparation',store:'Magasin',pri:'Priorité',pn:'Normal',pu:'Urgent',cables:'Câbles composants',addC:'+ Câble',cOk:'Disponible',cStore:'Magasin',save:'Enregistrer',cancel:'Annuler',edit:'Modifier',search:'Rechercher ligne, épissure ou câble…',stAll:'Statut: Tous',svAll:'Lieu: Tous',name:'Nom',zone:'Zone',newLine:'+ Nouvelle ligne',none:'Aucune donnée',nEp:'épissures',open:'ouvertes',pcs:'pièces manquantes',dem:'demandes',saved:'Enregistré',deleted:'Supprimé',sure:'Confirmer ?',fill:'Remplir ligne, nom et quantité',nol:'Ajoutez d’abord une ligne',used:'Utilisée sur les lignes',st_wait:'En attente',st_prep:'En préparation',st_avail:'Disponible',st_done:'Livré',foot:'Prototype indépendant — non connecté aux systèmes internes LEONI.'},
ar:{dash:'لوحة القيادة',lack:'النواقص',lines:'الخطوط',hist:'السجل',nLines:'خطوط الإنتاج',nTotal:'نواقص مفتوحة',nUrg:'نواقص مستعجلة',nDone:'طلبات مسلّمة',by:'حسب الحالة',recent:'آخر النواقص المستعجلة',add:'+ نقص جديد',addEp:'+ Épissure',line:'الخط',ref:'اسم / مرجع Épissure',req:'الكمية المطلوبة',avail:'الكمية المتوفرة',miss:'الكمية الناقصة',loc:'المكان',prep:'Préparation',store:'Magasin',pri:'الأولوية',pn:'عادي',pu:'مستعجل',cables:'الكابلات المكوّنة',addC:'+ كابل',cOk:'متوفر',cStore:'في Magasin',save:'حفظ',cancel:'إلغاء',edit:'تعديل',search:'ابحث عن خط أو Épissure أو كابل…',stAll:'الحالة: الكل',svAll:'المكان: الكل',name:'الاسم',zone:'المنطقة',newLine:'+ خط جديد',none:'لا توجد بيانات',nEp:'Épissures',open:'مفتوحة',pcs:'قطعة ناقصة',dem:'طلبات',saved:'تم الحفظ',deleted:'تم الحذف',sure:'متأكد؟',fill:'عمّر الخط والاسم والكمية',nol:'زيد خط أولا',used:'تُستعمل في الخطوط',st_wait:'في الانتظار',st_prep:'قيد التحضير',st_avail:'متوفر',st_done:'تم التسليم',foot:'نموذج أولي مستقل — غير مرتبط بأنظمة LEONI الداخلية.'},
en:{dash:'Dashboard',lack:'Shortages',lines:'Lines',hist:'History',nLines:'Production lines',nTotal:'Open shortages',nUrg:'Urgent shortages',nDone:'Delivered requests',by:'By status',recent:'Recent urgent shortages',add:'+ New shortage',addEp:'+ Splice',line:'Line',ref:'Splice name / reference',req:'Qty requested',avail:'Qty available',miss:'Qty missing',loc:'Location',prep:'Preparation',store:'Store',pri:'Priority',pn:'Normal',pu:'Urgent',cables:'Component cables',addC:'+ Cable',cOk:'Available',cStore:'In store',save:'Save',cancel:'Cancel',edit:'Edit',search:'Search line, splice or cable…',stAll:'Status: All',svAll:'Location: All',name:'Name',zone:'Zone',newLine:'+ New line',none:'No data',nEp:'splices',open:'open',pcs:'missing pieces',dem:'requests',saved:'Saved',deleted:'Deleted',sure:'Confirm?',fill:'Fill line, name and quantity',nol:'Add a line first',used:'Used on lines',st_wait:'Pending',st_prep:'In preparation',st_avail:'Available',st_done:'Delivered',foot:'Independent prototype — not connected to LEONI internal systems.'}};
const ST=['wait','prep','avail','done'],LOC=['prep','store','line'],SC={wait:'#e29a1a',prep:'#0a66d6',avail:'#0f9d6b',done:'#6b7893'};
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=()=>{const d=today();return{lines:[{id:1,name:'Ligne A1 – VW',zone:'Zone 1'},{id:2,name:'Ligne A2 – BMW',zone:'Zone 1'},{id:3,name:'Ligne B1 – Renault',zone:'Zone 2'},{id:4,name:'Ligne B2 – Peugeot',zone:'Zone 2'},{id:5,name:'Ligne C1 – Mercedes',zone:'Zone 3'}],
items:[{id:1,line:1,ref:'EP-45821',req:120,av:40,service:'prep',status:'wait',pri:'u',date:d,cables:[{r:'CB-1021',s:'ok'},{r:'CB-2210',s:'store'},{r:'CB-3305',s:'ok'}]},
{id:2,line:1,ref:'EP-77310',req:60,av:60,service:'line',status:'avail',pri:'n',date:d,cables:[]},
{id:3,line:2,ref:'EP-30917',req:80,av:60,service:'store',status:'prep',pri:'n',date:d,cables:[]},
{id:4,line:3,ref:'EP-11204',req:200,av:50,service:'prep',status:'prep',pri:'u',date:d,cables:[{r:'CB-4100',s:'store'}]},
{id:5,line:4,ref:'EP-45821',req:100,av:20,service:'store',status:'wait',pri:'u',date:d,cables:[{r:'CB-1021',s:'ok'},{r:'CB-2210',s:'store'}]}]}};
let S=JSON.parse(localStorage.getItem('lem')||'null')||seed(),lang=localStorage.getItem('lemL')||'fr',view='dash',cur=null,editId=null,q='',fs='',fv='';
const t=k=>T[lang][k]||k,save=()=>localStorage.setItem('lem',JSON.stringify(S)),miss=i=>Math.max(0,i.req-i.av),nid=a=>Math.max(0,...a.map(x=>x.id))+1;
const lname=id=>(S.lines.find(l=>l.id==id)||{name:'?'}).name;
const badge=s=>`<span class="badge"><i style="background:${SC[s]}"></i>${t('st_'+s)}</span>`;
function toast(m){const e=$('#toast');e.textContent=m;e.className='show';setTimeout(()=>e.className='',1800)}
function setLang(l){lang=l;localStorage.setItem('lemL',l);render()}
function go(v){view=v;render();scrollTo(0,0)}
function openLine(id){cur=id;view='line';render();scrollTo(0,0)}
function card(i,inLine){const m=miss(i);return`<div class="card ${i.pri=='u'&&i.status!='done'?'urg':''}"><div class="row"><b class="mono">${esc(i.ref)}</b>${badge(i.status)}</div>
<div class="mut">${inLine?'':esc(lname(i.line))+' · '}📍 ${t(i.service)} · ${i.date}</div>
<div class="nums"><div><b>${i.req}</b><span>${t('req')}</span></div><div><b>${i.av}</b><span>${t('avail')}</span></div><div><b class="${m?'red':'okc'}">${m}</b><span>${t('miss')}</span></div></div>
${i.cables.length?`<div class="sm">${t('cables')}</div><div class="chips">${i.cables.map((c,n)=>`<span class="chip ${c.s}" onclick="tc(${i.id},${n})">${esc(c.r)} · ${t(c.s=='ok'?'cOk':'cStore')}</span>`).join('')}</div>`:''}
<div class="row act"><select onchange="setSt(${i.id},this.value)">${ST.map(s=>`<option value="${s}" ${s==i.status?'selected':''}>${t('st_'+s)}</option>`).join('')}</select><button class="btn sq alt nxt" onclick="nxt(${i.id})">›</button><button class="btn sq alt" onclick="openForm(${i.id})">✏️</button><button class="btn sq del" onclick="del(${i.id})">🗑</button></div></div>`}
function setSt(id,s){S.items.find(i=>i.id==id).status=s;save();render()}
function nxt(id){const i=S.items.find(x=>x.id==id),n=ST.indexOf(i.status);if(n<3){i.status=ST[n+1];save();render();toast(t('saved'))}}
function del(id){if(confirm(t('sure'))){S.items=S.items.filter(i=>i.id!=id);save();render();toast(t('deleted'))}}
function tc(id,n){const c=S.items.find(i=>i.id==id).cables[n];c.s=c.s=='ok'?'store':'ok';save();render()}
function match(i){const k=q.trim().toLowerCase();return(!k||lname(i.line).toLowerCase().includes(k)||i.ref.toLowerCase().includes(k)||i.cables.some(c=>c.r.toLowerCase().includes(k)))&&(!fs||i.status==fs)&&(!fv||i.service==fv)}
function list(){const r=S.items.filter(match).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),k=q.trim().toLowerCase();let h='';
if(k){S.lines.filter(l=>l.name.toLowerCase().includes(k)).forEach(l=>{const o=S.items.filter(i=>i.line==l.id&&i.status!='done');h+=`<div class="card found" onclick="openLine(${l.id})"><div class="row"><b>${esc(l.name)}</b><span class="nxt">›</span></div><div class="mut">${S.items.filter(i=>i.line==l.id).length} ${t('nEp')} · <b class="red">${o.reduce((a,i)=>a+miss(i),0)}</b> ${t('pcs')}</div></div>`});
[...new Set(S.items.filter(i=>i.ref.toLowerCase().includes(k)).map(i=>i.ref))].forEach(f=>{h+=`<div class="card found"><b class="mono">${esc(f)}</b><div class="mut">${t('used')}:</div>${S.items.filter(i=>i.ref==f).map(i=>`<div class="row"><span>${esc(lname(i.line))} · 📍 ${t(i.service)}</span><b class="red">${miss(i)}</b></div>`).join('')}</div>`})}
$('#list').innerHTML=h+(r.map(i=>card(i)).join('')||`<p class="mut">${t('none')}</p>`)}
function crow(c){return`<div class="crow"><input value="${esc(c.r)}" placeholder="CB-0000"><select><option value="ok" ${c.s=='ok'?'selected':''}>${t('cOk')}</option><option value="store" ${c.s=='store'?'selected':''}>${t('cStore')}</option></select><button onclick="this.parentNode.remove()">✕</button></div>`}
function addC(){$('#cl').insertAdjacentHTML('beforeend',crow({r:'',s:'ok'}))}
function calc(){$('#fmv').textContent=Math.max(0,(+$('#fq').value||0)-(+$('#fa').value||0))}
function openForm(id,lid){if(!S.lines.length){toast(t('nol'));return}editId=id||null;
const i=id?S.items.find(x=>x.id==id):{line:lid||(view=='line'?cur:S.lines[0].id),ref:'',req:'',av:'',service:'prep',pri:'n',cables:[]};
$('#modal').innerHTML=`<div class="sheet"><h3>${id?t('edit'):t('add')}</h3>
<label>${t('line')}</label><select id="fl">${S.lines.map(l=>`<option value="${l.id}" ${l.id==i.line?'selected':''}>${esc(l.name)}</option>`).join('')}</select>
<label>${t('ref')}</label><input id="fr" value="${esc(i.ref)}" placeholder="EP-00000">
<div class="g2"><div><label>${t('req')}</label><input id="fq" type="number" inputmode="numeric" min="0" value="${i.req}" oninput="calc()"></div><div><label>${t('avail')}</label><input id="fa" type="number" inputmode="numeric" min="0" value="${i.av}" oninput="calc()"></div></div>
<div class="miss">${t('miss')}: <b id="fmv">${i.ref?miss(i):0}</b></div>
<div class="g2"><div><label>${t('loc')}</label><select id="fs">${LOC.map(s=>`<option value="${s}" ${s==i.service?'selected':''}>${t(s)}</option>`).join('')}</select></div><div><label>${t('pri')}</label><select id="fp"><option value="n">${t('pn')}</option><option value="u" ${i.pri=='u'?'selected':''}>${t('pu')}</option></select></div></div>
<label>${t('cables')}</label><div id="cl">${i.cables.map(crow).join('')}</div><button class="btn alt" style="margin:8px 0" onclick="addC()">${t('addC')}</button>
<button class="btn" onclick="saveForm()">${t('save')}</button><button class="btn alt" style="margin-top:8px" onclick="closeForm()">${t('cancel')}</button></div>`;
$('#modal').style.display='flex'}
function closeForm(){$('#modal').style.display='none'}
function saveForm(){const ref=$('#fr').value.trim(),req=+$('#fq').value;if(!ref||!req){toast(t('fill'));return}
const cables=[...document.querySelectorAll('#cl .crow')].map(r=>({r:r.querySelector('input').value.trim(),s:r.querySelector('select').value})).filter(c=>c.r);
const d={line:+$('#fl').value,ref,req,av:+$('#fa').value||0,service:$('#fs').value,pri:$('#fp').value,cables};
if(editId)Object.assign(S.items.find(i=>i.id==editId),d);else S.items.push({id:nid(S.items),status:'wait',date:today(),...d});
save();closeForm();render();toast(t('saved'))}
function addLine(){const n=$('#ln').value.trim();if(!n)return;S.lines.push({id:nid(S.lines),name:n,zone:$('#lz').value.trim()});save();render();toast(t('saved'))}
function editLine(id){const l=S.lines.find(x=>x.id==id),n=prompt(t('name'),l.name);if(n===null)return;const z=prompt(t('zone'),l.zone);l.name=n.trim()||l.name;if(z!==null)l.zone=z.trim();save();render();toast(t('saved'))}
function delLine(id){if(confirm(t('sure'))){S.lines=S.lines.filter(l=>l.id!=id);S.items=S.items.filter(i=>i.line!=id);save();view='lines';render();toast(t('deleted'))}}
function vDash(){const o=S.items.filter(i=>i.status!='done'),u=o.filter(i=>i.pri=='u'),n=s=>S.items.filter(i=>i.status==s).length;
const k=(v,l)=>`<div class="card kpi"><b>${v}</b><span>${l}</span></div>`;
return`<div class="g2">${k(S.lines.length,t('nLines'))}${k(o.length,t('nTotal'))}${k(u.length,t('nUrg'))}${k(n('done'),t('nDone'))}</div>
<div class="card"><b>${t('by')}</b><div style="margin-top:10px">${ST.map(s=>`<div class="row"><span>${t('st_'+s)}</span><b>${n(s)}</b></div><div class="bar"><div style="width:${S.items.length?n(s)/S.items.length*100:0}%;background:${SC[s]}"></div></div>`).join('')}</div></div>
<div class="card"><div class="row"><b>${t('recent')}</b><a href="#" onclick="go('lack');return false" style="color:var(--blue)">${t('lack')} →</a></div>${u.slice(0,4).map(i=>`<div class="row" style="margin-top:12px"><div><b class="mono">${esc(i.ref)}</b><div class="mut">${esc(lname(i.line))}</div></div><div style="text-align:end"><b class="red">−${miss(i)}</b><br>${badge(i.status)}</div></div>`).join('')||`<p class="mut">${t('none')}</p>`}</div>`}
function vLack(){return`<button class="btn" style="margin-bottom:12px" onclick="openForm()">${t('add')}</button>
<div class="top"><input id="sq" value="${esc(q)}" placeholder="${t('search')}" oninput="q=this.value;list()">
<div class="g2" style="margin-top:8px"><select onchange="fs=this.value;list()"><option value="">${t('stAll')}</option>${ST.map(s=>`<option value="${s}" ${fs==s?'selected':''}>${t('st_'+s)}</option>`).join('')}</select>
<select onchange="fv=this.value;list()"><option value="">${t('svAll')}</option>${LOC.map(s=>`<option value="${s}" ${fv==s?'selected':''}>${t(s)}</option>`).join('')}</select></div></div><div id="list"></div>`}
function vLines(){return`<div class="card"><div class="g2"><div><label>${t('name')}</label><input id="ln" placeholder="Ligne D1"></div><div><label>${t('zone')}</label><input id="lz" placeholder="Zone 4"></div></div><button class="btn" style="margin-top:12px" onclick="addLine()">${t('newLine')}</button></div>
<div class="card" style="padding:0;overflow:hidden"><table><tr><th>${t('line')}</th><th>${t('nEp')}</th><th>${t('miss')}</th><th></th></tr>${S.lines.map(l=>{const a=S.items.filter(i=>i.line==l.id),o=a.filter(i=>i.status!='done');return`<tr onclick="openLine(${l.id})"><td><b>${esc(l.name)}</b><div class="mut">${esc(l.zone)}</div></td><td>${a.length}</td><td class="red"><b>${o.reduce((s,i)=>s+miss(i),0)}</b></td><td><button class="btn sq del" onclick="event.stopPropagation();delLine(${l.id})">🗑</button></td></tr>`}).join('')}</table></div>`}
function vLine(){const l=S.lines.find(x=>x.id==cur);if(!l){view='lines';return vLines()}
const a=S.items.filter(i=>i.line==cur),m=a.filter(i=>i.status!='done').reduce((s,i)=>s+miss(i),0);
return`<button class="back" onclick="go('lines')"><span class="nxt" style="display:inline-block">‹</span> ${t('lines')}</button>
<div class="card"><div class="row"><div><b style="font-size:19px">${esc(l.name)}</b><div class="mut">${esc(l.zone)}</div></div><button class="btn sq alt" onclick="editLine(${l.id})">✏️</button></div>
<div class="g2 kpi" style="margin-top:10px"><div><b>${a.length}</b><span>${t('nEp')}</span></div><div><b class="${m?'red':'okc'}">${m}</b><span>${t('miss')}</span></div></div></div>
<button class="btn" style="margin-bottom:12px" onclick="openForm(null,${l.id})">${t('addEp')}</button>
${a.map(i=>card(i,true)).join('')||`<p class="mut">${t('none')}</p>`}`}
function vHist(){const g={};S.items.forEach(i=>(g[i.date]=g[i.date]||[]).push(i));
return Object.keys(g).sort().reverse().map(d=>`<div class="card"><div class="row"><b style="font-size:19px">${d}</b><span class="mut">${g[d].length} ${t('dem')} · <b class="red">${g[d].reduce((a,i)=>a+miss(i),0)}</b> ${t('pcs')}</span></div>${g[d].map(i=>`<div class="row" style="border-top:1px solid var(--ln);padding:10px 0 0;margin-top:10px"><div><b class="mono">${esc(i.ref)}</b><div class="mut">${esc(lname(i.line))}</div></div>${badge(i.status)}</div>`).join('')}</div>`).join('')||`<p class="mut">${t('none')}</p>`}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';$('#lg').value=lang;
$('#ttl').textContent=view=='line'?lname(cur):t(view);
$('#app').innerHTML={dash:vDash,lack:vLack,lines:vLines,line:vLine,hist:vHist}[view]();if(view=='lack')list();
$('#nav').innerHTML=[['dash','📊'],['lack','⚠️'],['lines','🏭'],['hist','🗓️']].map(([v,e])=>`<button class="${view==v||(v=='lines'&&view=='line')?'on':''}" onclick="go('${v}')"><span>${e}</span>${t(v)}</button>`).join('');$('#ft').textContent=t('foot')}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
